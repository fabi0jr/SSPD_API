# Produção na VPS: soma este arquivo ao docker-compose.yml.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
# (no .env da VPS, COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml faz o
#  "docker compose" sozinho já usar os dois arquivos.)
#
# O Traefik da VPS já ocupa as portas 80/443 e termina o HTTPS (Let's Encrypt).
# O Nginx do projeto não publica porta e não entra na infra-network dos outros
# projetos: ele e o Traefik dividem só a rede sspd-edge (172.30.0.0/24), criada
# pelo compose do Traefik (~/projetos/infra). api, worker e postgres ficam só na
# rede interna do projeto.

services:
  nginx:
    ports: !reset []
    networks: [default, sspd-edge]
    labels:
      traefik.enable: "true"
      traefik.docker.network: sspd-edge
      traefik.http.routers.sspd.rule: Host(`sspd.fj-dev.tech`)
      traefik.http.routers.sspd.tls.certresolver: letsencrypt
      traefik.http.services.sspd.loadbalancer.server.port: "80"

networks:
  sspd-edge:
    external: true
