# Nginx: proxy reverso e balanceamento entre as réplicas da API.
#
# Versão mínima, feita junto com o docker-compose.yml para o sistema subir.
# A infra completa com HTTPS (443 + certificado), rate limit e o que mais for
# preciso. Recomendações: docs/integracao-infra.md, seção 4.

# "api" é o serviço do Compose. Com 2 réplicas, o DNS do Docker devolve os dois
# IPs e o Nginx distribui as requisições entre eles (round-robin).
# O nome é resolvido quando o Nginx inicia: depois de recriar as réplicas
# (docker compose up --force-recreate api), reinicie o nginx também.
upstream api {
    server api:8000 max_fails=1 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Leituras e logins são JSON pequenos.
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Réplica parada: desiste rápido e tenta a outra.
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    # Sensores. O POST /leituras é idempotente (o id vem do sensor), então é
    # seguro reenviar para a outra réplica se a primeira cair no meio.
    # Sem http_503: o 503 da API (banco fora, com Retry-After) precisa chegar
    # ao cliente, e não ser trocado por um 502 do Nginx.
    location = /leituras {
        proxy_pass http://api;
        proxy_next_upstream error timeout http_502 non_idempotent;
    }

    # PATCH /alertas/{id} também é idempotente; POST /pacientes não (o reenvio daria 409).
    # Sem barra no fim: com "location /alertas/", o Nginx responderia 301 ao GET /alertas.
    location /alertas {
        proxy_pass http://api;
        proxy_next_upstream error timeout http_502 non_idempotent;
    }

    # Demais rotas: /health, /auth/login, /pacientes, /alertas, /docs, /openapi.json.
    # Sem non_idempotent, o Nginx só reenvia GET e afins.
    location / {
        proxy_pass http://api;
        proxy_next_upstream error timeout http_502;
    }
}
