# Nginx: proxy reverso, balanceamento entre as réplicas da API, rate limit e o dashboard.
#
# Produção: o Traefik da VPS termina o HTTPS (Let's Encrypt) e repassa para cá
# pela rede sspd-edge (docker-compose.prod.yml). Local: acesso direto na HTTP_PORT.
# Contrato com o backend: docs/integracao-infra.md, seção 4. Infra: docs/infra.md.

# "api" é o serviço do Compose. Com 2 réplicas, o DNS do Docker devolve os dois
# IPs e o Nginx distribui as requisições entre eles (round-robin).
# O nome é resolvido quando o Nginx inicia: depois de recriar as réplicas
# (docker compose up --force-recreate api), reinicie o nginx também.
upstream api {
    server api:8000 max_fails=1 fail_timeout=10s;
    keepalive 32;
}

# IP real do cliente: só confia no X-Forwarded-For vindo do Traefik (rede sspd-edge, subnet fixa).
# Sem isso, todo mundo teria o IP do Traefik e o rate limit valeria para todos juntos.
set_real_ip_from 172.30.0.0/24;
real_ip_header X-Forwarded-For;

# O Traefik já diz se a conexão original era HTTPS; local, vale o scheme do próprio Nginx.
map $http_x_forwarded_proto $proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Rate limit por IP (zonas usadas nos locations abaixo).

limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=leituras:1m rate=300r/s;


limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Leituras e logins são JSON pequenos.
    client_max_body_size 64k;

    # Cabeçalhos de segurança. O HSTS só vale quando chega por HTTPS (Traefik).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto;

    # Réplica parada: desiste rápido e tenta a outra.
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    # Dashboard (dashboard/index.html, montado em /usr/share/nginx/html).
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # O dashboard chama /api/*: a barra no fim do proxy_pass tira o prefixo
    # (/api/pacientes -> /pacientes), porque as rotas da API ficam na raiz.
    location /api/ {
        proxy_pass http://api/;
        proxy_next_upstream error timeout http_502;
    }

    # Login: limite apertado contra força bruta de senha (com ou sem o prefixo /api).
    location ~ ^(/api)?/auth/login$ {
        limit_req zone=login burst=5 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://api;
        proxy_next_upstream error timeout http_502;
    }

    # Sensores. O POST /leituras é idempotente (o id vem do sensor), então é
    # seguro reenviar para a outra réplica se a primeira cair no meio.
    # Sem http_503: o 503 da API (banco fora, com Retry-After) precisa chegar
    # ao cliente, e não ser trocado por um 502 do Nginx.
    location = /leituras {
        limit_req zone=leituras burst=100 nodelay;
        proxy_pass http://api;
        proxy_next_upstream error timeout http_502 non_idempotent;
    }

    # PATCH /alertas/{id} também é idempotente; POST /pacientes não (o reenvio daria 409).
    # Sem barra no fim: com "location /alertas/", o Nginx responderia 301 ao GET /alertas.
    location /alertas {
        proxy_pass http://api;
        proxy_next_upstream error timeout http_502 non_idempotent;
    }

    # Demais rotas: /health, /pacientes, /docs, /openapi.json.
    # Sem non_idempotent, o Nginx só reenvia GET e afins.
    location / {
        proxy_pass http://api;
        proxy_next_upstream error timeout http_502;
    }
}
